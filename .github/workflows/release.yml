name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The app is compiled with swiftc for both architectures on one machine,
    # so the zip is universal by construction. Building it here rather than
    # uploading a local zip matters when the maintainer is on a throttled
    # connection: the runner's upload to the release is fast, ours is not.
    # A current runner, not the oldest one. macos-14 ships a Swift compiler old
    # enough to give up ("unable to type-check this expression in reasonable
    # time") on SwiftUI bodies the maintainer's own toolchain compiles without
    # complaint. The binaries still target macOS 13 — see -target in build.sh.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the router engine payload
        run: ./fetch-payload.sh

      - name: Build
        run: ./ZLTApp/build.sh

      - name: Package
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "ZLTApp/ZLT X28.app" "ZLT-X28-${GITHUB_REF_NAME}-universal.zip"
          shasum -a 256 "ZLT-X28-${GITHUB_REF_NAME}-universal.zip" \
            > "ZLT-X28-${GITHUB_REF_NAME}-universal.zip.sha256"

      # RELEASE_NOTES.md is written by hand, newest section first. The release
      # body is that first section, so the notes a tag publishes are the ones
      # written for it rather than a list of commits.
      - name: Take the notes for this version
        run: awk '/^## /{n++} n==1' RELEASE_NOTES.md > body.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          files: |
            ZLT-X28-*-universal.zip
            ZLT-X28-*-universal.zip.sha256
