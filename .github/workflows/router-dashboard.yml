name: Router dashboard CI

on:
  push:
    branches: ["feature/router-hosted-web-panel"]
    paths:
      - "web/**"
      - "go.mod"
      - "awg/zlt-web.init"
      - "ZLTApp/Resources/router/install.sh"
      - "ZLTApp/build.sh"
      - ".github/workflows/router-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Test dashboard and proxy parsers
        run: go test ./...
      - name: Build router binary
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/zlt-web-linux-arm64 ./web
      - name: Check installer scripts
        run: |
          sh -n ZLTApp/Resources/router/install.sh
          sh -n awg/zlt-web.init
          bash -n ZLTApp/build.sh
